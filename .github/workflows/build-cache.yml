name: build-cache
on:
  schedule:
    - cron: "0 */3 * * *"     # every 3 hours (more chances to land a non-blocked runner)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build-cache
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build cache.json (tolerate theshow.com 403 on blocked runner IPs)
        run: |
          for i in 1 2 3; do
            if node build-cache.js; then exit 0; fi
            echo "attempt $i was blocked; retrying in 45s"; sleep 45
          done
          echo "::warning::theshow.com blocked this runner IP this run — keeping the previous cache.json"
          exit 0
      - name: Commit if changed
        run: |
          git config user.name "cache-bot"
          git config user.email "cache-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain cache.json)" ]; then
            git add cache.json && git commit -m "cache: refresh $(date -u +%FT%TZ)" && git push
          else
            echo "unchanged or blocked — nothing to commit"
          fi
